<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — DRMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="auth-body">

  <div class="auth-container">
    <!-- Animated background grid -->
    <div class="auth-bg">
      <div class="grid-lines"></div>
    </div>

    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">◈</span>
        <h1><a href="{{ url_for('landing') }}" style="color: inherit; text-decoration: none;">DRMS</a></h1>
        <p>Driver And Road Monitor System</p>
      </div>

      {% if error %}
      <div class="auth-error">⚠ {{ error }}</div>
      {% endif %}

      <form method="POST" class="auth-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="driver@example.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn-auth">LOGIN</button>
      </form>

      <div class="auth-footer">
        No account? <a href="{{ url_for('register') }}">Register here</a>
      </div>
      <!-- <div class="auth-demo-hint">
        Demo: <code>demo@dms.com</code> / <code>demo1234</code>
      </div> -->
    </div>
  </div>

</body>
</html>
