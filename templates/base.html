<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}DRMS — Driver And Road Monitor System{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  {% block extra_head %}{% endblock %}
</head>
<body{% block body_class %}{% endblock %}>

  {% block nav %}
  <nav class="topnav">
    <div class="nav-brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name"><a href="{{ url_for('landing') }}" style="color: inherit; text-decoration: none;">DRMS</a></span>
      <span class="brand-sub">Driver And Road Monitor System</span>
    </div>
    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
        ◉ Dashboard
      </a>
      <a href="{{ url_for('history') }}" class="nav-link {% if request.endpoint == 'history' %}active{% endif %}">
        ◈ History
      </a>
      <a href="{{ url_for('settings') }}" class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}">
        ◇ Settings
      </a>
    </div>
    <div class="nav-user">
      <span class="user-name">{{ user_name }}</span>
      <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
    </div>
  </nav>
  {% endblock %}

  {% block main %}
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}

  {% block footer %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
