<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Register — DMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-bg"><div class="grid-lines"></div></div>
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">◈</span>
        <h1>DMS</h1>
        <p>Create your account</p>
      </div>

      {% if error %}<div class="auth-error">⚠ {{ error }}</div>{% endif %}

      <form method="POST" class="auth-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" placeholder="Your Name" required/>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="phone" placeholder="+91-9000000000"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Min 8 characters" required/>
        </div>
        <button type="submit" class="btn btn-auth">CREATE ACCOUNT</button>
      </form>
      <div class="auth-footer">
        Already registered? <a href="{{ url_for('login') }}">Login here</a>
      </div>
    </div>
  </div>

</body>
</html>
